name: Windows Desktop CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "formal/**"
      - "scheduler/formal/**"
      - "scheduler/branding/**"
      - "scheduler/desktop/**"
      - "scheduler/frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "formal/**"
      - "scheduler/formal/**"
      - "scheduler/branding/**"
      - "scheduler/desktop/**"
      - "scheduler/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: 9.0.312
  NODE_VERSION: 24.12.0
  CI_RELEASE_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  verify:
    name: Build and test Windows desktop
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify public source snapshot
        if: ${{ hashFiles('docs/release/SOURCE_SNAPSHOT.sha256') != '' }}
        shell: bash
        run: ./scheduler/desktop/scripts/verify-source-snapshot.sh

      - name: Verify branding assets
        shell: powershell
        run: ./scheduler/desktop/scripts/verify-branding-assets.ps1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scheduler/frontend/package-lock.json

      - name: Install MSYS2 MinGW-w64 toolchain
        uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-binutils

      - name: Record native toolchain versions
        shell: msys2 {0}
        run: |
          gcc --version
          mingw32-make --version
          objdump --version

      - name: Build static SolverWorker
        shell: msys2 {0}
        run: ./scheduler/desktop/scripts/build-windows-solver-worker.sh

      - name: Build optional CakeLPR checker
        shell: msys2 {0}
        run: ./scheduler/desktop/scripts/build-cake-lpr.sh

      - name: Run locked Windows release gate
        shell: powershell
        env:
          SCHEDULER_RELEASE_VERSION: ${{ env.CI_RELEASE_VERSION }}
        run: >-
          ./scheduler/desktop/scripts/verify-windows-release.ps1
          -SolverWorkerPath ./scheduler/desktop/native/SolverWorker/out/windows-x64/SolverWorker.exe
          -ReleaseVersion $env:SCHEDULER_RELEASE_VERSION
          -SkipExternalFixtureTests

      - name: Upload verified publish directory
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-desktop-ci-${{ github.run_number }}
          path: scheduler/desktop/artifacts/windows-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke-tested diagnostics executable
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-diagnostics-ci-${{ github.run_number }}
          path: scheduler/desktop/artifacts/diagnostics-windows-x64/Scheduler.Diagnostics.exe
          if-no-files-found: error
          retention-days: 14
